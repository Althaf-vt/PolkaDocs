name: polkadocs

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: polkadocs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: PolkaDocs
      POSTGRES_PASSWORD: password
      POSTGRES_DB: PolkaDocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U PolkaDocs -d PolkaDocs"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: polkadocs_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://PolkaDocs:password@db:5432/PolkaDocs

volumes:
  pgdata: